<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weatherly - Weather forecast</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='31' cy='17' r='9' fill='%23ffd978'/%3E%3Cpath d='M14 38a8 8 0 0 1 0-16 11 11 0 0 1 21 3 7 7 0 0 1-1 13z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
</head>
<body data-sky="clear">

  <!-- Sky colours: these cross-fade when the weather changes -->
  <div class="sky" aria-hidden="true">
    <div class="layer active" data-sky="clear"></div>
    <div class="layer" data-sky="cloudy"></div>
    <div class="layer" data-sky="rain"></div>
    <div class="layer" data-sky="snow"></div>
    <div class="layer" data-sky="storm"></div>
    <div class="layer" data-sky="night"></div>
  </div>

  <!-- Clouds, sun, moon, rain, snow and lightning are drawn here -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <header class="top">
      <a class="logo" href="/" aria-label="Weatherly home">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="31" cy="17" r="9" fill="#ffd978"/>
          <path d="M14 38a8 8 0 0 1 0-16 11 11 0 0 1 21 3 7 7 0 0 1-1 13z" fill="#fff"/>
        </svg>
        <span>Weatherly</span>
      </a>

      <div class="search-wrap">
        <form id="search" class="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="city" type="text" placeholder="Search for a city" aria-label="City name" required>
          <button type="submit">Search</button>
        </form>
        <ul id="suggest" class="suggest" hidden></ul>
      </div>

      <div class="unit" id="unit" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="c" class="on">°C</button>
        <button type="button" data-unit="f">°F</button>
      </div>
    </header>

    <div class="chips-row">
      <div class="chips" id="recent" aria-label="Recent searches"></div>
      <div class="preview" id="preview" role="group" aria-label="Preview weather">
        <span class="preview-label">Preview the sky</span>
        <button type="button" data-preview="clear" title="Sunny">☀️</button>
        <button type="button" data-preview="cloudy" title="Cloudy">☁️</button>
        <button type="button" data-preview="rain" title="Rain">🌧️</button>
        <button type="button" data-preview="storm" title="Thunderstorm">⛈️</button>
        <button type="button" data-preview="snow" title="Snow">❄️</button>
        <button type="button" data-preview="night" title="Night">🌙</button>
      </div>
    </div>

    <p id="status" class="status" role="status"></p>

    <main id="content" class="content"></main>

    <footer class="foot">Weather data by OpenWeatherMap</footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
